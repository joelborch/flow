version: 2
updates:
  # One npm entry for the whole pnpm workspace — the shared lockfile lives at
  # the root, and per-package entries just multiply every bump into five PRs.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is the Go-native rewrite; hold at 5.x until the tooling
      # ecosystem (vitest, wrangler, editors) settles on it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # action-setup v6 bundles a pnpm whose self-installer crashes against
      # this repo's lockfile (verified in CI); stay on v4 until fixed upstream.
      - dependency-name: "pnpm/action-setup"
        update-types: ["version-update:semver-major"]
