version: 2
updates:
  # pnpm workspace root (dependabot resolves the shared pnpm-lock.yaml from here).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/packages/shared"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/packages/core"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/apps/api"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/apps/importer"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
